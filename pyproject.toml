[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jkg"
version = "7.0.0"
description = "JKG 7.0 — Unified Memory Fabric: profile, factual, episodic, and procedural memory in one SQLite database."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Altynai & Jessica"}]
keywords = ["ai", "memory", "knowledge-graph", "embeddings", "rag", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "sqlite-vec>=0.1.9",
    "requests>=2.28",
    "numpy>=1.24",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=3,<4",
    "scipy>=1.11,<2",
]
test = [
    "fastapi>=0.128,<1",
    "httpx>=0.28,<1",
    "pytest>=8,<9",
]
server = [
    "fastapi>=0.128,<1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn[standard]>=0.38,<1",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
mcp = [
    "mcp>=1.23,<2",
]
benchmark = [
    "google-genai>=2,<3",
    "mem0ai>=2,<3",
]

[project.scripts]
jkg = "jkg.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jkg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "provider: real external provider contract tests",
    "postgres: real Postgres + pgvector integration tests",
]
