[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "clark"
version = "7.0.0"
description = "Clark 7.0 — Unified Memory Fabric: profile, factual, episodic, and procedural memory in one SQLite database."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Nomads AI Lab"}]
keywords = ["ai", "memory", "knowledge-graph", "embeddings", "rag", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "sqlite-vec>=0.1.9",
    "requests>=2.28",
    "numpy>=1.24",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/Nomads-AI-Lab/clark"
Repository = "https://github.com/Nomads-AI-Lab/clark"
Issues = "https://github.com/Nomads-AI-Lab/clark/issues"
Documentation = "https://github.com/Nomads-AI-Lab/clark#readme"

[project.optional-dependencies]
local = [
    "sentence-transformers>=5.5.1,<6",
    "scipy>=1.11,<2",
]
test = [
    "fastapi>=0.128,<1",
    "httpx>=0.28,<1",
    "pytest>=9.0.3,<10",
]
server = [
    "fastapi>=0.128,<1",
    "psycopg[binary]>=3.3.4,<4",
    "uvicorn[standard]>=0.49.0,<1",
]
postgres = [
    "psycopg[binary]>=3.3.4,<4",
]
mcp = [
    "mcp>=1.23,<2",
]
benchmark = [
    "google-genai>=2,<3",
    "mem0ai>=2.0.5,<3",
]

[project.scripts]
clark = "clark.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "provider: real external provider contract tests",
    "postgres: real Postgres + pgvector integration tests",
]
