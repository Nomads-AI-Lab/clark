services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clark}
      POSTGRES_USER: ${POSTGRES_USER:-clark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clark-local-dev-password}
    volumes:
      - clark-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clark} -d ${POSTGRES_DB:-clark}"]
      interval: 10s
      timeout: 5s
      retries: 10

  clark-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CLARK_ENV: production
      CLARK_DATABASE_URL: ${CLARK_DATABASE_URL:-postgresql://clark:clark-local-dev-password@postgres:5432/clark}
      CLARK_TENANT_ID: ${CLARK_TENANT_ID:-default}
      CLARK_DB_PATH: /data/memory_v3.db
    volumes:
      - clark-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clark-data:
  clark-postgres:
