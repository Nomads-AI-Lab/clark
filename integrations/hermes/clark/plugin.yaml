name: clark
type: memory_provider
description: Clark memory provider backed by the Clark HTTP API.
entrypoint: clark
hooks:
  - initialize
  - system_prompt_block
  - prefetch
  - sync_turn
  - get_tool_schemas
  - handle_tool_call
  - shutdown
config:
  required_env:
    - CLARK_API_URL
    - CLARK_AUTH_TOKEN
