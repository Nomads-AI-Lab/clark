[mcp_servers.jkg]
command = "uv"
args = ["run", "--directory", "/absolute/path/to/jessica-knowledge-graph", "jkg", "mcp"]
enabled = true

[mcp_servers.jkg.env]
JKG_DATABASE_URL = "postgresql://jkg:strong-password@127.0.0.1:5432/jkg"
GEMINI_API_KEY = "${GEMINI_API_KEY}"
DEEPSEEK_API_KEY = "${DEEPSEEK_API_KEY}"
